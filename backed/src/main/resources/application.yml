server:
  port: ${SERVER_PORT:8922}
  shutdown: graceful

spring:
  application:
    name: spark-kafka-recommendation-system

  # ========================= 数据源 =========================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:recommendation}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ========================= Kafka =========================
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: recommendation-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 500
        session.timeout.ms: 30000
    properties:
      compression.type: lz4

  # ========================= Jackson =========================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # ========================= Spring AI =========================
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.7
          max-tokens: 1024
      retry:
        max-attempts: 3

# ========================= Kafka Topics =========================
kafka:
  topic:
    user-events: user-events
    product-ratings: product-ratings
    recommendations: recommendations
    default-partitions: 1
    default-replicas: 1
    auto-create: true

# ========================= Spark =========================
spark:
  app:
    name: SparkRecommendationSystem
  master: "local[*]"
  executor:
    memory: 1g
  driver:
    memory: 1g
  sql:
    streaming:
      checkpointLocation: /tmp/spark-checkpoint

# ========================= 推荐系统 =========================
recommendation:
  top-n: 10
  default:
    count: 10
  user:
    min-ratings: 5
  similarity:
    threshold: 0.5
  jobs:
    aggregate-preferences:
      enabled: true
      initial-delay-ms: 60000
      fixed-delay-ms: 3600000
    cleanup-preference-delta:
      enabled: true
      cron: "0 10 3 * * *"
      retention-days: 30
      batch-size: 5000
    time-zone: Asia/Shanghai

# ========================= 安全 =========================
security:
  jwt:
    secret: ${JWT_SECRET:d2VlZnJlY29tbWVuZGF0aW9uc3lzdGVtc2VjcmV0a2V5MTIzNDU2Nzg5MA==}
    expiration-ms: 86400000
  auth:
    username: ${AUTH_USERNAME:admin}
    password: ${AUTH_PASSWORD:admin123}

# ========================= AI =========================
ai:
  api-key: ${OPENAI_API_KEY:placeholder}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  proxy:
    host: ${AI_PROXY_HOST:}
    port: ${AI_PROXY_PORT:0}

# ========================= Actuator =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
